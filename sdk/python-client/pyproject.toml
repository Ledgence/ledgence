[build-system]
requires = ["flit_core==3.12.0"]
build-backend = "flit_core.buildapi"

[project]
name = "ledgence-client"
version = "0.1.1"
description = "An asynchronous Python client for Ledgence tasks, workflows, and completion notifications"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "third_party/NOTICE.md", "third_party/licenses/**/*"]
authors = [{name = "Ledgence", email = "dev@ledgence.com"}]
dependencies = [
  "aiohappyeyeballs==2.7.1",
  "aiohttp==3.14.3",
  "aiosignal==1.4.0",
  "attrs==26.1.0",
  "frozenlist==1.8.0",
  "idna==3.19",
  "multidict==6.8.0",
  "propcache==0.5.2",
  'typing-extensions==4.16.0; python_version < "3.13"',
  "yarl==1.24.5",
]

[project.urls]
Homepage = "https://github.com/Ledgence/ledgence"
Documentation = "https://github.com/Ledgence/ledgence/blob/main/sdk/python-client/README.md"
Repository = "https://github.com/Ledgence/ledgence"
Issues = "https://github.com/Ledgence/ledgence/issues"
Changelog = "https://github.com/Ledgence/ledgence/releases"

[project.optional-dependencies]
otel = ["opentelemetry-api==1.44.0", "typing-extensions==4.16.0"]

[tool.flit.module]
name = "ledgence.client"

[tool.flit.sdist]
include = ["tests/", "third_party/"]
