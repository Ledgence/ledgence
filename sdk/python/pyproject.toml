[build-system]
requires = ["flit_core==3.12.0"]
build-backend = "flit_core.buildapi"

[project]
name = "ledgence-worker"
version = "0.4.1"
description = "Dependency-free Python authoring helpers for Ledgence tasks and checkpoint workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ledgence", email = "dev@ledgence.com"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/Ledgence/ledgence"
Documentation = "https://github.com/Ledgence/ledgence/blob/develop/sdk/python/README.md"
Repository = "https://github.com/Ledgence/ledgence"
Issues = "https://github.com/Ledgence/ledgence/issues"
Changelog = "https://github.com/Ledgence/ledgence/releases"

[tool.flit.module]
name = "ledgence.worker"

[tool.flit.sdist]
include = ["tests/test_installed_package.py"]
