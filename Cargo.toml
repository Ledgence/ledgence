[workspace]
members = [
  "crates/ledgence-worker-api",
  "crates/ledgence-worker-core",
  "crates/ledgence-adapter-artifact",
  "crates/ledgence-adapter-subprocess",
  "crates/ledgence-worker",
  "crates/ledgence-orchestration-api",
  "crates/ledgence-orchestration-core",
  "crates/ledgence-orchestration-service",
  "crates/ledgence-adapter-postgres",
  "crates/ledgence-worker-delivery",
  "crates/ledgence-adapter-http",
  "crates/ledgence-orchestrator",
  "crates/ledgence-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/Ledgence/ledgence"

[workspace.dependencies]
ledgence-worker-api = { version = "0.1.0", path = "crates/ledgence-worker-api" }
ledgence-worker-core = { version = "0.1.0", path = "crates/ledgence-worker-core" }
ledgence-worker-delivery = { version = "0.1.0", path = "crates/ledgence-worker-delivery" }
ledgence-adapter-http = { version = "0.1.0", path = "crates/ledgence-adapter-http", default-features = false }
ledgence-orchestration-api = { version = "0.1.0", path = "crates/ledgence-orchestration-api" }
ledgence-orchestration-core = { version = "0.1.0", path = "crates/ledgence-orchestration-core" }
ledgence-adapter-artifact = { version = "0.1.0", path = "crates/ledgence-adapter-artifact" }
ledgence-adapter-subprocess = { version = "0.1.0", path = "crates/ledgence-adapter-subprocess" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "net", "signal"] }
sha2 = "0.10.9"
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls"] }
time = { version = "0.3.55", default-features = false, features = ["formatting"] }

sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "migrate", "macros"] }
ledgence-orchestration-service = { version = "0.1.0", path = "crates/ledgence-orchestration-service" }
ledgence-adapter-postgres = { version = "0.1.0", path = "crates/ledgence-adapter-postgres" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
