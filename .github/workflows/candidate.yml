name: Candidate packaging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Candidate bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    env:
      SQLX_OFFLINE: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out committed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up CPython
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Select the repository Rust toolchain
        run: rustup show active-toolchain
      - name: Build and verify candidate artifacts
        run: python tools/release/package.py --candidate rc.1 --output "$RUNNER_TEMP/ledgence-candidate"
      - name: Verify candidate archive checksum
        working-directory: ${{ runner.temp }}/ledgence-candidate
        run: shasum -a 256 -c SHA256SUMS
# Intentionally no upload, tag, push, release creation or branch promotion.
# Integration and capacity qualification remain separate required gates.
