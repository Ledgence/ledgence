name: Candidate packaging

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Candidate label (rc.N)
        type: string
        default: rc.1
      include_console:
        description: Also build a Linux x86_64 candidate with Console
        type: boolean
        default: true
      local_distribution_run:
        description: Optional successful container distribution run containing the pinned local kit for this source
        type: string
        default: ''

permissions:
  contents: read
  actions: read

env:
  SQLX_OFFLINE: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  CANDIDATE: ${{ inputs.candidate }}
  LOCAL_DISTRIBUTION_RUN: ${{ inputs.local_distribution_run }}

jobs:
  candidate:
    name: Headless candidate bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    outputs:
      linux_artifact_id: ${{ steps.freeze.outputs.linux_artifact_id }}
      linux_artifact_name: ${{ steps.freeze.outputs.linux_artifact_name }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Check out committed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up CPython
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Select the repository Rust toolchain
        run: rustup show active-toolchain
      - name: Validate selected local distribution source
        if: inputs.local_distribution_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$LOCAL_DISTRIBUTION_RUN" =~ ^[1-9][0-9]*$ ]]
          test "$(gh run view "$LOCAL_DISTRIBUTION_RUN" --json headSha --jq .headSha)" = "$GITHUB_SHA"
          test "$(gh run view "$LOCAL_DISTRIBUTION_RUN" --json conclusion --jq .conclusion)" = success
          echo "LEDGENCE_LOCAL_DISTRIBUTION=$RUNNER_TEMP/ledgence-local-distribution" >> "$GITHUB_ENV"
      - name: Download the selected digest-pinned local kit
        if: inputs.local_distribution_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: local-distribution
          path: ${{ runner.temp }}/ledgence-local-distribution
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.local_distribution_run }}
      - name: Build and verify candidate artifacts
        run: python tools/release/package.py --candidate "$CANDIDATE" --headless --output "$RUNNER_TEMP/ledgence-candidate"
      - name: Verify candidate archive checksum
        working-directory: ${{ runner.temp }}/ledgence-candidate
        run: shasum -a 256 -c SHA256SUMS
      - name: Retain verified headless candidate
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-headless-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ledgence-candidate/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Freeze the Linux headless artifact identity
        id: freeze
        if: matrix.os == 'ubuntu-24.04'
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          echo "linux_artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "linux_artifact_name=candidate-headless-ubuntu-24.04-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  frameworks:
    name: Candidate framework recovery (${{ matrix.framework }})
    needs: [candidate, console]
    # Console is optional only for explicitly partial headless qualification.
    if: ${{ always() && needs.candidate.result == 'success' && ((inputs.include_console && needs.console.result == 'success') || (!inputs.include_console && needs.console.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [pydantic_ai, google_adk, claude_agent_sdk]
    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ledgence-test
          POSTGRES_DB: ledgence
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ledgence"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      LEDGENCE_POSTGRES_URL: postgres://postgres:ledgence-test@127.0.0.1:5432/ledgence
    steps:
      - name: Check out candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up candidate framework CPython
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Download the selected immutable Linux candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ inputs.include_console && needs.console.outputs.artifact_id || needs.candidate.outputs.linux_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/framework-candidate-download
      - name: Verify candidate source and runtime before framework execution
        env:
          LEDGENCE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.include_console && needs.console.outputs.artifact_id || needs.candidate.outputs.linux_artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.include_console && needs.console.outputs.artifact_name || needs.candidate.outputs.linux_artifact_name }}
          CANDIDATE_MODE: ${{ inputs.include_console && 'static' || 'headless' }}
        run: |
          python tools/release/framework_qualification.py prepare \
            --download "$RUNNER_TEMP/framework-candidate-download" \
            --extracted "$RUNNER_TEMP/framework-candidate-extracted" \
            --bundle "$RUNNER_TEMP/ledgence-framework-bundle" \
            --state "$RUNNER_TEMP/framework-candidate-state.json" --mode "$CANDIDATE_MODE"
          cat > "$RUNNER_TEMP/ledgence-psql" <<'SH'
          #!/bin/sh
          exec docker exec -i "$LEDGENCE_POSTGRES_CONTAINER" psql "$@"
          SH
          chmod +x "$RUNNER_TEMP/ledgence-psql"
          echo "LEDGENCE_POSTGRES_CONTAINER=$LEDGENCE_POSTGRES_CONTAINER" >> "$GITHUB_ENV"
      - name: Qualify extracted candidate SDK and worker recovery
        env:
          FRAMEWORK: ${{ matrix.framework }}
          FRAMEWORK_HELPER_ROOT: ${{ runner.temp }}/ledgence-framework-bundle/runtime
          FRAMEWORK_BINARIES: ${{ runner.temp }}/ledgence-framework-bundle/bin
          LEDGENCE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          export FRAMEWORK="${FRAMEWORK#framework-}"
          python tools/check-framework-integrations.py --framework "$FRAMEWORK" \
            --python "$LEDGENCE_PYTHON" --helper-root "$FRAMEWORK_HELPER_ROOT" \
            --evidence "$RUNNER_TEMP/framework-sdk"
          python tools/check-framework-workers.py --framework "$FRAMEWORK" \
            --sdk-evidence "$RUNNER_TEMP/framework-sdk" --binaries "$FRAMEWORK_BINARIES" \
            --runner "$FRAMEWORK_HELPER_ROOT/ledgence/worker/bootstrap.py" \
            --psql "$RUNNER_TEMP/ledgence-psql" --evidence "$RUNNER_TEMP/framework-workers"
          python tools/release/framework_qualification.py receipt \
            --state "$RUNNER_TEMP/framework-candidate-state.json" \
            --bundle "$RUNNER_TEMP/ledgence-framework-bundle" --framework "$FRAMEWORK" \
            --sdk "$RUNNER_TEMP/framework-sdk/summary.json" \
            --worker "$RUNNER_TEMP/framework-workers/summary.json" \
            --output "$RUNNER_TEMP/framework-qualification"
      - name: Retain candidate framework qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-framework-${{ matrix.framework }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/framework-qualification/
          if-no-files-found: error
          retention-days: 30

  console:
    name: Console candidate bundle (Linux x86_64)
    if: inputs.include_console
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_name: ${{ steps.freeze.outputs.artifact_name }}
    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ledgence-test
          POSTGRES_DB: ledgence
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ledgence"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      LEDGENCE_POSTGRES_URL: postgres://postgres:ledgence-test@127.0.0.1:5432/ledgence
    steps:
      - name: Check out committed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up CPython
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Set up the repository Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: console/.nvmrc
      - name: Install the exact reviewed Console toolchain and graph
        run: |
          corepack enable
          corepack prepare pnpm@11.27.1 --activate
          pnpm --dir console install --frozen-lockfile --ignore-scripts
      - name: Build source-qualified Console assets
        run: pnpm --dir console build
      - name: Select the repository Rust toolchain
        run: rustup show active-toolchain
      - name: Validate selected local distribution source
        if: inputs.local_distribution_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$LOCAL_DISTRIBUTION_RUN" =~ ^[1-9][0-9]*$ ]]
          test "$(gh run view "$LOCAL_DISTRIBUTION_RUN" --json headSha --jq .headSha)" = "$GITHUB_SHA"
          test "$(gh run view "$LOCAL_DISTRIBUTION_RUN" --json conclusion --jq .conclusion)" = success
          echo "LEDGENCE_LOCAL_DISTRIBUTION=$RUNNER_TEMP/ledgence-local-distribution" >> "$GITHUB_ENV"
      - name: Download the selected digest-pinned local kit
        if: inputs.local_distribution_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: local-distribution
          path: ${{ runner.temp }}/ledgence-local-distribution
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.local_distribution_run }}
      - name: Build and verify candidate artifacts with relocated Console
        run: |
          python tools/release/package.py --candidate "$CANDIDATE" \
            --console-dist console/dist --output "$RUNNER_TEMP/ledgence-candidate"
      - name: Verify candidate archive checksum
        working-directory: ${{ runner.temp }}/ledgence-candidate
        run: shasum -a 256 -c SHA256SUMS
      - name: Rehearse migrations and restore with published predecessor bundles
        env:
          LEDGENCE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          rehearsal="$RUNNER_TEMP/approval-upgrade"
          mkdir -p "$rehearsal/postgres"
          for tool in psql pg_dump pg_restore; do
            cat > "$rehearsal/postgres/$tool" <<'SH'
          #!/bin/sh
          exec docker exec -i "$LEDGENCE_POSTGRES_CONTAINER" "$(basename "$0")" "$@"
          SH
            chmod +x "$rehearsal/postgres/$tool"
          done
          mkdir -p "$rehearsal/candidate"
          archives=("$RUNNER_TEMP"/ledgence-candidate/*.tar.gz)
          test "${#archives[@]}" -eq 1
          tar -xzf "${archives[0]}" --strip-components=1 -C "$rehearsal/candidate"
          while read -r version checksum rehearsal_script <&3; do
            baseline="ledgence-$version-x86_64-unknown-linux-gnu"
            previous="$rehearsal/previous-$version"
            mkdir -p "$previous"
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
              "https://github.com/Ledgence/ledgence/releases/download/v$version/$baseline.tar.gz" \
              --output "$rehearsal/$baseline.tar.gz"
            echo "$checksum  $rehearsal/$baseline.tar.gz" | sha256sum --check
            tar -xzf "$rehearsal/$baseline.tar.gz" --strip-components=1 -C "$previous"
            python "tools/$rehearsal_script" --previous-bundle "$previous" --psql "$rehearsal/postgres/psql" \
              --binaries "$rehearsal/candidate/bin" --console-dist "$rehearsal/candidate/console" \
              --candidate-runner "$rehearsal/candidate/runtime/ledgence/worker/bootstrap.py" \
              --evidence "$rehearsal/evidence/$version" < /dev/null
          done 3<<'BASELINES'
          0.6.1 7fc70c2e520d4bfb5836136e8811d3cec61399545d3c26eebeca2a29e3ad38be check-approval-upgrade.py
          0.7.0 1795cc0ed9acc42613ab8e8c63d845a9ce5235a5d06cff4a5289e287d06143c3 check-approval-upgrade.py
          0.8.0 343942fcb3e142abc3636e1458203e697e0c27b2a4a5300bd6603412270bce5e check-resource-upgrade.py
          0.9.0 c6566558ca60a774b3517d21a96b76a1feb3cc4d4493213c4eefc077347b64ef check-artifact-upgrade.py
          BASELINES
          python3 tools/release/upgrade_evidence.py "$rehearsal"
      - name: Qualify candidate program profiles against released 0.9
        # Full release qualification requires include_console=true and this gate.
        # A headless-only packaging run skips it; that skip is not a passed profile check.
        env:
          LEDGENCE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          python tools/check-program-profiles.py \
            --binaries "$RUNNER_TEMP/approval-upgrade/candidate/bin" \
            --runner "$RUNNER_TEMP/approval-upgrade/candidate/runtime/ledgence/worker/bootstrap.py" \
            --legacy-binaries "$RUNNER_TEMP/approval-upgrade/previous-0.9.0/bin" \
            --legacy-runner "$RUNNER_TEMP/approval-upgrade/previous-0.9.0/runtime/ledgence/worker/bootstrap.py" \
            --psql "$RUNNER_TEMP/approval-upgrade/postgres/psql" \
            --evidence "$RUNNER_TEMP/program-profiles-evidence"
          python - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          report = json.loads((root / 'program-profiles-evidence/summary.json').read_text())
          assert report['passed'] is True and report['cleanup_complete'] is True
          assert report['scenarios'] and all(case['passed'] is True for case in report['scenarios'])
          expected = {label: hashlib.sha256((root / 'approval-upgrade' / directory / 'bin/ledgence').read_bytes()).hexdigest()
                      for label, directory in [('candidate', 'candidate'), ('legacy', 'previous-0.9.0')]}
          assert report['binary_sha256'] == expected
          PYTHON
      - name: Retain candidate program-profile evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-program-profiles-linux-x86_64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/program-profiles-evidence/summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Qualify artifact S3 adapter and persisted objects after restart
        run: |
          python tools/check-artifact-s3.py --evidence "$RUNNER_TEMP/artifact-s3"
          python tools/release/upgrade_evidence.py "$RUNNER_TEMP/approval-upgrade" --s3 "$RUNNER_TEMP/artifact-s3"
      - name: Retain artifact S3 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-artifact-s3-linux-x86_64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact-s3/
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain upgrade evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-upgrade-linux-x86_64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/approval-upgrade/evidence/
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain verified Console candidate
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-console-linux-x86_64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ledgence-candidate/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Freeze the Console artifact identity
        id: freeze
        run: echo "artifact_name=candidate-console-linux-x86_64-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
# Retained Actions artifacts are candidates, not public GitHub Releases.
# Integration and capacity qualification remain separate required gates.
