name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  RUSTDOCFLAGS: -D warnings
  PYTHONDONTWRITEBYTECODE: '1'
  SQLX_OFFLINE: 'true'

jobs:
  test:
    name: Rust and Python (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up CPython ${{ matrix.python }}
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install the repository Rust toolchain
        run: rustup show active-toolchain
      - name: Check crate boundaries
        run: python tools/check-boundaries.py
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust warnings
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test Rust and real subprocess execution
        env:
          LEDGENCE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Test Rust documentation
        run: cargo test --workspace --doc --all-features --locked
      - name: Build Rust documentation
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Test the Python runner
        run: python -m unittest discover -s sdk/python/tests -v

  postgres:
    name: PostgreSQL 18 delivery and query metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # PostgreSQL 18.6; multi-platform image index verified 2026-09-13.
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ledgence-test
          POSTGRES_DB: ledgence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ledgence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LEDGENCE_POSTGRES_URL: postgres://postgres:ledgence-test@127.0.0.1:5432/ledgence
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python for verification tooling
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install the repository Rust toolchain
        run: rustup show active-toolchain
      - name: Check queries and transactional PostgreSQL behavior
        env:
          LEDGENCE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          cat > "$RUNNER_TEMP/ledgence-psql" <<'SH'
          #!/bin/sh
          exec docker exec -i "$LEDGENCE_POSTGRES_CONTAINER" psql "$@"
          SH
          chmod +x "$RUNNER_TEMP/ledgence-psql"
          python tools/check-postgres.py --psql "$RUNNER_TEMP/ledgence-psql"

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the repository Rust toolchain
        run: rustup show active-toolchain
      - name: Install the reviewed dependency checker
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check licenses, advisories, and sources
        run: cargo deny --locked check
