name: Console
on:
  push:
    paths: ['console/**', 'contracts/**', 'crates/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.sqlx/**', 'sdk/python/**', 'examples/**', 'tools/**', 'deploy/**', 'LICENSE', '.dockerignore', '.github/workflows/console.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: console-${{ github.ref }}
  cancel-in-progress: true
jobs:
  console:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ledgence-test
          POSTGRES_DB: ledgence
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ledgence"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SQLX_OFFLINE: 'true'
      LEDGENCE_POSTGRES_URL: postgres://postgres:ledgence-test@127.0.0.1:5432/ledgence
      PYTHONDONTWRITEBYTECODE: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: console/.nvmrc
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        id: python
        with:
          python-version: '3.14'
      - name: Install the exact reviewed Console toolchain and graph
        run: |
          corepack enable
          corepack prepare pnpm@11.27.1 --activate
          pnpm --dir console install --frozen-lockfile --ignore-scripts
          pnpm --dir console exec playwright install --with-deps chromium webkit
      - name: Check source, fixtures and reviewed dependencies
        run: |
          pnpm --dir console format:check
          pnpm --dir console lint
          pnpm --dir console typecheck
          pnpm --dir console licenses:check
          pnpm --dir console audit --audit-level low
          cargo test -p ledgence-orchestration-api --test console_contracts --locked
          pnpm --dir console contracts:check
      - name: Test components and browser behavior
        run: |
          pnpm --dir console test
          pnpm --dir console test:e2e
      - name: Build source-qualified static assets and Rust executables
        run: |
          pnpm --dir console build
          cargo build --locked --all-features --bins -p ledgence-cli -p ledgence-orchestrator -p ledgence-worker
      - name: Exercise Console with real PostgreSQL, HTTP, workers and browsers
        env:
          LEDGENCE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          python tools/check-console.py --binaries target/debug --console-dist console/dist \
            --evidence "$RUNNER_TEMP/console-native" \
            --browser-command pnpm --dir console test:live
      - name: Preserve failures and exact acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: console-qualification
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/console-native
            console/playwright-report
            console/test-results
