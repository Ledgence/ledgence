name: Documentation
on:
  push:
    branches: [develop, main]
    paths: ['docs-site/**', 'docs/**', 'sdk/**', 'examples/**', 'deploy/local/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs-site/**', 'docs/**', 'sdk/**', 'examples/**', 'deploy/local/**', '.github/workflows/docs.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        manager: [npm, pnpm]
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: docs-site/.nvmrc
      - if: matrix.manager == 'npm'
        run: npm ci --ignore-scripts
      - if: matrix.manager == 'pnpm'
        run: |
          npm install --global pnpm@11.19.0 --ignore-scripts
          pnpm import
          git diff --exit-code -- pnpm-lock.yaml
          pnpm install --frozen-lockfile
      - run: ${{ matrix.manager }} run test
      - run: ${{ matrix.manager }} run build
