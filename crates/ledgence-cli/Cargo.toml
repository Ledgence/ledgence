[package]
name = "ledgence-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Unified Ledgence command line for programs, tasks, workers, and orchestration"

[[bin]]
name = "ledgence"
path = "src/main.rs"

[features]
default = ["otel", "mcp"]
mcp = ["dep:ledgence-adapter-mcp", "dep:tokio-util", "tokio/io-std"]
otel = ["dep:ledgence-adapter-otel", "ledgence-worker/otel", "ledgence-orchestrator/otel"]
sqs = ["ledgence-worker/sqs", "ledgence-orchestrator/sqs"]

[dependencies]
ledgence-adapter-mcp = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
ledgence-worker.workspace = true
ledgence-orchestrator.workspace = true
ledgence-adapter-otel = { workspace = true, optional = true }
ledgence-adapter-http = { workspace = true, features = ["client"] }
ledgence-orchestration-api.workspace = true
ledgence-worker-api.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["fs"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["signal", "process"] }

[lints]
workspace = true
