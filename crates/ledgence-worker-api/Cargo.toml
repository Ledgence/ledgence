[package]
name = "ledgence-worker-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
readme = "README.md"
documentation = "https://docs.rs/ledgence-worker-api"
keywords = ["orchestration", "workflow", "worker", "cloudevents"]
categories = ["asynchronous"]
include = ["src/**/*.rs", "tests/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]
description = "Portable contracts for Ledgence worker adapters"

[dependencies]
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
iri-string = { version = "0.7.14", default-features = false }
time = { version = "0.3.55", default-features = false, features = ["parsing"] }

[lints]
workspace = true
