[package]
name = "ledgence-adapter-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
client = ["dep:reqwest", "dep:sha2", "dep:rustix", "dep:http-body", "dep:bytes", "dep:base64"]
completion = ["dep:reqwest"]
server = ["dep:axum", "dep:http-body-util", "dep:sha2", "dep:getrandom", "dep:http-body", "dep:bytes", "dep:base64"]

[dependencies]
http-body = { version = "=1.1.0", optional = true }
bytes = { version = "=1.12.1", optional = true }
base64 = { version = "=0.22.1", optional = true }
ledgence-orchestration-api.workspace = true
ledgence-worker-api.workspace = true
sha2 = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
reqwest = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
http-body-util = { version = "0.1.3", optional = true }

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"], optional = true }
