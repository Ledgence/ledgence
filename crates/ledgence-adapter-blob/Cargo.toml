[package]
name = "ledgence-adapter-blob"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
s3 = ["dep:aws-sdk-s3", "dep:aws-config", "dep:aws-smithy-http-client", "dep:aws-smithy-runtime-api", "dep:aws-smithy-types", "dep:http-body", "dep:bytes", "dep:url", "dep:base64", "dep:http-body-util"]

[dependencies]
ledgence-orchestration-api.workspace = true
ledgence-worker-api.workspace = true
tokio.workspace = true
sha2.workspace = true
getrandom.workspace = true
aws-sdk-s3 = { version = "=1.153.0", default-features = false, features = ["rt-tokio", "default-https-client"], optional = true }
aws-config = { version = "=1.13.0", default-features = false, features = ["rt-tokio", "default-https-client"], optional = true }
aws-smithy-http-client = { version = "=1.5.1", default-features = false, features = ["rustls-aws-lc"], optional = true }
aws-smithy-runtime-api = { version = "=1.19.1", features = ["client"], optional = true }
aws-smithy-types = { version = "=1.9.0", features = ["http-body-1-x"], optional = true }
http-body-util = { version = "=0.1.5", optional = true }
http-body = { version = "=1.1.0", optional = true }
bytes = { version = "=1.12.1", optional = true }
url = { version = "=2.5.8", optional = true }
base64 = { version = "=0.22.1", optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
